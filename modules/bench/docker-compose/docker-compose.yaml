services:
  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-setup:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing myminio/xtdb-bucket &&
      echo 'MinIO bucket created'"

  kafka:
    image: apache/kafka:4.0.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: xtdb-bench-local
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 10

  xtdb-node-1: &xtdb-node
    image: xtdb-bench:local
    environment: &xtdb-env
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      XTDB_LOG_TOPIC: xtdb-log
      XTDB_SINGLE_WRITER: "true"
      XTDB_S3_BUCKET: xtdb-bucket
      XTDB_S3_ENDPOINT: http://minio:9000
      ACCESS_KEY: minioadmin
      SECRET_KEY: minioadmin
      AWS_REGION: us-east-1
      JDK_JAVA_OPTIONS: "-Xmx1g -Xms1g"
    volumes:
      - ./xtdb-config.yaml:/config/xtdb-config.yaml:ro
    command: ["auctionmark", "-f", "/config/xtdb-config.yaml", "--scale-factor", "0.01", "--duration", "PT2M", "--threads", "2"]

  xtdb-node-2:
    <<: *xtdb-node

  xtdb-node-3:
    <<: *xtdb-node
